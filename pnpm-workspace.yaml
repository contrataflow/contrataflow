# Fonte única de versões do monorepo (RN-FND-01 · US-077).
# - Dependências externas: "catalog:" (ou "catalog:react") no package.json do pacote.
# - Dependências internas: "workspace:*".
# - Somente versões EXATAS aqui; faixas (^, ~, *, latest) são proibidas (pnpm check:versions).
# - Dependência nova exige a justificativa da RN-FND-11 no PR e aprovação dos donos deste arquivo.
# Linhas, motivos e medições: docs/engineering/versions.md.

packages:
  - apps/*
  - packages/*
  - tools

# Recusa versões publicadas há menos de 3 dias (defesa de cadeia de suprimentos — RS-11).
minimumReleaseAge: 4320

# `pnpm add` só aceita versões do catálogo.
catalogMode: strict

# Scripts de instalação só destes pacotes (pnpm 10 bloqueia os demais — RS-11).
# Inclusão somente após revisão de segurança (CODEOWNERS).
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

# Scripts revisados e dispensáveis (binários nativos já chegam por optionalDependencies).
ignoredBuiltDependencies:
  - '@parcel/watcher'
  # A CLI do Prisma baixa o schema-engine sob demanda no primeiro uso (US-081).
  - '@prisma/engines'
  - cpu-features
  # Acelerador nativo opcional do msgpackr (BullMQ — US-082); sem ele o msgpackr usa JS puro.
  - msgpackr-extract
  - prisma
  - protobufjs
  - ssh2
  - unrs-resolver

