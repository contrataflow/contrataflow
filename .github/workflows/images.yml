# Estágio 6 — Imagens (US-079 · RN-FND-26 · security.md §19), reutilizado pelo PR (ci.yml) e pelo
# pós-merge (deploy-staging.yml) para não duplicar o pipeline. Por app: build multi-stage, SBOM
# CycloneDX (Syft), varredura (Trivy) com o gate de CVE do repositório e assinatura (cosign).
# - PR: imagem num registry local efêmero, assinada com chave descartável (prova a assinatura sem
#   segredo nenhum — PR de fork incluído).
# - Pós-merge: push no ECR (OIDC, sem chave estática), assinatura keyless (Sigstore) e atestado do
#   SBOM; o deploy verifica a assinatura antes de usar a imagem.
name: Imagens

on:
  workflow_call:
    inputs:
      push-to-ecr:
        description: Publica no ECR e assina keyless (pós-merge); senão, registry local efêmero.
        type: boolean
        default: false
      environment:
        description: Ambiente do GitHub com AWS_OIDC_ROLE_ARN e ECR_REGISTRY (pós-merge).
        type: string
        default: ''

# Sem `permissions:` aqui: o workflow herda as do chamador — `contents: read` no PR; no pós-merge,
# também `id-token: write` (OIDC da AWS e do Sigstore). Declarar aqui só poderia reduzir.

defaults:
  run:
    shell: bash

env:
  SYFT_IMAGE: anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  build:
    name: Imagem (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, worker]
    services:
      registry:
        image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar dependências (gate de CVE)
        uses: ./.github/actions/setup

      - name: Credenciais AWS por OIDC
        if: inputs.push-to-ecr
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no ECR
        if: inputs.push-to-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Referência da imagem
        id: ref
        env:
          PUSH: ${{ inputs.push-to-ecr }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          echo "OUT=$RUNNER_TEMP/images" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/images"
          if [ "$PUSH" = "true" ]; then registry="$ECR_REGISTRY"; else registry="localhost:5000"; fi
          echo "image=$registry/contrataflow-$APP:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      # FA-04: registry instável ganha uma segunda tentativa antes da falha definitiva.
      - name: Build multi-stage
        id: build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/prod.Dockerfile
          target: runtime-${{ matrix.app }}
          build-args: APP=${{ matrix.app }}
          tags: ${{ steps.ref.outputs.image }}
          push: true
          load: true
          provenance: false
          cache-from: type=gha,scope=image-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.app }}

      - name: Build multi-stage (2ª tentativa)
        id: build-retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/prod.Dockerfile
          target: runtime-${{ matrix.app }}
          build-args: APP=${{ matrix.app }}
          tags: ${{ steps.ref.outputs.image }}
          push: true
          load: true
          provenance: false
          cache-from: type=gha,scope=image-${{ matrix.app }}

      - name: Digest publicado
        id: digest
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest || steps.build-retry.outputs.digest }}
        run: |
          repo="${IMAGE%:*}"
          echo "ref=$repo@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$repo@$DIGEST" > "$OUT/digest-$APP.txt"

      - name: SBOM CycloneDX (Syft)
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$OUT:/out"
          "$SYFT_IMAGE" "docker:$IMAGE" -o "cyclonedx-json=/out/sbom-$APP.cdx.json" -q

      - name: Cache da base de vulnerabilidades do Trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Atualizar a base do Trivy (retry — FA-04)
        run: >-
          pnpm --dir tools exec tsx ci/retry.ts --service "Trivy (base de vulnerabilidades)"
          --attempts 3 --delay 20 --timeout 300 --
          docker run --rm -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE"
          image --download-db-only --quiet

      - name: Varredura de vulnerabilidades (Trivy)
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: >-
          pnpm --dir tools exec tsx ci/retry.ts --service "Trivy" --attempts 2 --delay 10
          --timeout 600 --
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$OUT:/out" "$TRIVY_IMAGE"
          image --skip-db-update --scanners vuln --severity HIGH,CRITICAL --format json
          --output "/out/trivy-$APP.json" --exit-code 0 --quiet "$IMAGE"

      - name: Gate de CVE (crítica/alta com correção bloqueia)
        id: cve
        run: pnpm --dir tools exec tsx ci/cve-gate.ts --report "$OUT/trivy-$APP.json" --image "$APP"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Assinatura (chave descartável, registry local)
        if: ${{ !inputs.push-to-ecr }}
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: |
          export COSIGN_PASSWORD
          COSIGN_PASSWORD=$(openssl rand -hex 16)
          cd "$RUNNER_TEMP"
          cosign generate-key-pair
          cosign sign --yes --key cosign.key --use-signing-config=false --tlog-upload=false \
            --allow-http-registry "$REF"
          cosign verify --key cosign.pub --insecure-ignore-tlog=true --allow-http-registry "$REF" > /dev/null
          rm -f cosign.key

      - name: Assinatura keyless e atestado do SBOM (Sigstore)
        if: inputs.push-to-ecr
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate "$OUT/sbom-$APP.cdx.json" "$REF"

      - name: Relatórios (SBOM, Trivy, digest)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.app }}
          path: ${{ env.OUT }}/
          retention-days: 30
          if-no-files-found: ignore

      - name: Fim do estágio
        if: always()
        uses: ./.github/actions/stage-log
        with:
          stage: 6. Imagens (${{ matrix.app }})
          status: ${{ job.status }}
