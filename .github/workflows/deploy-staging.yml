# Pós-merge (US-079 · RN-FND-20/28 · architecture.md §11.4): estágio 6 com publicação no ECR e
# assinatura keyless → deploy em staging (imagem verificada antes) → estágio 8 (Pós-deploy: ZAP
# baseline, k6 smoke, verificação de traces). Falha no 8 alerta o time e bloqueia a promoção para
# produção, sem desfazer o merge. Produção exige aprovação no ambiente `production`.
#
# Habilitação: variável de repositório CF_STAGING_ENABLED=true quando a infraestrutura de staging
# existir (Terraform); variáveis/segredos de cada ambiente em CONTRIBUTING.md → "Pipeline de CI".
name: Deploy staging

on:
  push:
    branches: [main]

# Deploys nunca se cancelam no meio: o próximo espera o anterior terminar.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ZAP_IMAGE: zaproxy/zap-stable:2.17.0@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2
  K6_IMAGE: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
  CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/images.yml@refs/heads/main
  CERT_ISSUER: https://token.actions.githubusercontent.com

jobs:
  preflight:
    name: Pré-condições do deploy
    if: vars.CF_STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Deploy só para merges feitos por quem tem papel de maintainer (ou admin) no repositório.
      - name: Quem fez o merge é maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          role=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.role_name')
          case "$role" in
            admin|maintain) echo "✔ $ACTOR ($role)";;
            *) echo "::error title=Deploy recusado::$ACTOR ($role) não é maintainer: deploy em staging não executado."; exit 1;;
          esac

  images:
    name: Imagens
    needs: preflight
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      id-token: write
    with:
      push-to-ecr: true
      environment: staging

  deploy:
    name: Deploy em staging
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar dependências
        uses: ./.github/actions/setup

      - name: Digests das imagens
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # security.md §19: só sobe imagem assinada por ESTE repositório, a partir da main.
      - name: Verificar assinaturas
        run: |
          for file in "$RUNNER_TEMP"/images/*/digest-*.txt; do
            ref=$(cat "$file")
            cosign verify --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$CERT_ISSUER" "$ref" > /dev/null
            echo "✔ assinatura válida: $ref"
          done

      - name: Migração e rollout no ECS
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          PREFIX: ${{ vars.ECS_SERVICE_PREFIX }}
          MIGRATOR: ${{ vars.ECS_MIGRATOR_FAMILY }}
          NETWORK: ${{ vars.ECS_MIGRATOR_NETWORK }}
        run: >-
          pnpm --dir tools exec tsx ci/deploy-ecs.ts --digests "$RUNNER_TEMP/images"
          --cluster "$CLUSTER" --service-prefix "$PREFIX" --migrator "$MIGRATOR" --network "$NETWORK"

  post-deploy:
    name: 8. Pós-deploy
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar dependências
        uses: ./.github/actions/setup

      - name: OWASP ZAP baseline (DAST passivo)
        env:
          TARGET: ${{ vars.STAGING_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/zap" && cp .github/zap/rules.tsv "$RUNNER_TEMP/zap/" && chmod -R 777 "$RUNNER_TEMP/zap"
          docker run --rm -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" zap-baseline.py \
            -t "$TARGET" -c rules.tsv -I -r zap-report.html -J zap-report.json

      - name: k6 smoke
        if: success() || failure()
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: >-
          docker run --rm -e STAGING_URL -e STAGING_API_URL -v "$PWD/.github/k6:/scripts:ro"
          "$K6_IMAGE" run --quiet /scripts/smoke.js

      - name: Verificação de traces
        if: success() || failure()
        env:
          TARGET: ${{ vars.STAGING_API_URL }}/health/ready
          QUERY: ${{ vars.TRACES_QUERY_URL }}
          TRACES_QUERY_TOKEN: ${{ secrets.TRACES_QUERY_TOKEN }}
        run: pnpm --dir tools exec tsx ci/verify-traces.ts --target "$TARGET" --query "$QUERY"

      - name: Relatórios do ZAP
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: ${{ runner.temp }}/zap/
          retention-days: 30
          if-no-files-found: ignore

      - name: Alertar o time (#cf-ci)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "::warning::SLACK_CI_WEBHOOK_URL não configurado."; exit 0; fi
          text="⚠ Pós-deploy em staging falhou para ${SHA:0:12}: promoção para produção bloqueada. $RUN_URL"
          jq -n --arg text "$text" '{text: $text}' | curl -fsS -X POST -H 'content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"

      - name: Fim do estágio
        if: always()
        uses: ./.github/actions/stage-log
        with:
          stage: 8. Pós-deploy
          status: ${{ job.status }}

  # Gate da promoção (RN-FND-28): só roda com o estágio 8 verde e aprovação no ambiente production.
  promote-production:
    name: Promoção para produção
    needs: post-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar dependências
        uses: ./.github/actions/setup

      - name: Digests das imagens (as mesmas de staging, sem rebuild)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verificar assinaturas
        run: |
          for file in "$RUNNER_TEMP"/images/*/digest-*.txt; do
            cosign verify --certificate-identity "$CERT_IDENTITY" \
              --certificate-oidc-issuer "$CERT_ISSUER" "$(cat "$file")" > /dev/null
          done

      - name: Migração e rollout no ECS (produção)
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          PREFIX: ${{ vars.ECS_SERVICE_PREFIX }}
          MIGRATOR: ${{ vars.ECS_MIGRATOR_FAMILY }}
          NETWORK: ${{ vars.ECS_MIGRATOR_NETWORK }}
        run: >-
          pnpm --dir tools exec tsx ci/deploy-ecs.ts --digests "$RUNNER_TEMP/images"
          --cluster "$CLUSTER" --service-prefix "$PREFIX" --migrator "$MIGRATOR" --network "$NETWORK"
