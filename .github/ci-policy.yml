# Política do pipeline de CI (US-079 — Campos). Lida por tools/ci (lib/policy.ts). Fica em .github/
# de propósito: alterar exige Tech Lead + segurança (CODEOWNERS), e a revisão do PR que altera este
# arquivo é a aprovação registrada de cada exceção.

ci:
  # RN-FND-24 — cobertura mínima de linhas do código novo em domain/ + application/, por módulo
  # tocado no PR (0–100). Mesmo limiar do release-checklist.md.
  coverageThreshold: 80
  # Desativar só por decisão registrada da liderança técnica (cite a DEC no PR).
  coverageGateEnabled: true

licenses:
  # RN-FND-10 (US-077) — licenças aceitas nas dependências de runtime de api, web e worker.
  # GPL, AGPL, SSPL, BUSL e licenças desconhecidas bloqueiam (estágio Higiene).
  allowed:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - 0BSD
    - BlueOak-1.0.0
    - MPL-2.0
  # Exceções aprovadas: `package` aceita `*` no fim; `license` é a expressão exata do pacote.
  exceptions:
    - package: caniuse-lite
      license: CC-BY-4.0
      reason: >-
        Base de dados de compatibilidade de navegadores (dados, não código), dependência transitiva
        do Next.js; a atribuição exigida pela CC-BY-4.0 segue no próprio pacote.
      approvedBy: Tech Lead + segurança (revisão do PR da US-079)
    - package: '@img/sharp-libvips-*'
      license: LGPL-3.0-or-later
      reason: >-
        Binário pré-compilado do libvips usado pelo sharp (otimização de imagens do Next.js),
        carregado dinamicamente e sem modificação — as obrigações da LGPL ficam atendidas.
      approvedBy: Tech Lead + segurança (revisão do PR da US-079)
    - package: '@img/sharp-*'
      license: Apache-2.0 AND LGPL-3.0-or-later
      reason: >-
        Pacote de plataforma do sharp que embute o mesmo libvips (LGPL, linkagem dinâmica).
      approvedBy: Tech Lead + segurança (revisão do PR da US-079)
    - package: nodemailer
      license: MIT-0
      reason: >-
        Envio dos e-mails transacionais do worker (US-112). MIT sem a cláusula de atribuição:
        não impõe obrigação alguma (mesma família do 0BSD, já aceito).
      approvedBy: Mantenedor (revisão do PR #7, lote de 2026-10-20)
    - package: postgres
      license: Unlicense
      reason: >-
        Transitiva de prisma@7 (@prisma/client depende da CLI): driver usado pelo Prisma Studio,
        que as apps não executam. Domínio público, sem obrigação.
      approvedBy: Mantenedor (revisão do PR #7, lote de 2026-10-20)
    - package: robust-predicates
      license: Unlicense
      reason: >-
        Transitiva de prisma@7 → @prisma/studio-core → visx/d3-delaunay (interface do Prisma
        Studio, que as apps não executam). Domínio público, sem obrigação.
      approvedBy: Mantenedor (revisão do PR #7, lote de 2026-10-20)
    - package: elkjs
      license: EPL-2.0
      reason: >-
        Transitiva de prisma@7 → @prisma/studio-core (layout de diagramas do Prisma Studio, que as
        apps não executam). Biblioteca distribuída sem modificação, em módulo separado: as
        obrigações da EPL-2.0 (fonte do próprio elkjs e avisos) ficam atendidas pelo pacote
        publicado. Trocar por exceção com prazo se o Prisma deixar de embutir o Studio.
      approvedBy: Mantenedor (revisão do PR #7, lote de 2026-10-20)

cve:
  # RN-FND-26 · FA-03 — CVE crítica/alta SEM correção disponível vira exceção com prazo de revisão
  # (security.md §19). Vencido o prazo, a exceção deixa de valer e o pós-deploy alerta o time.
  # Formato: { id: CVE-AAAA-NNNN, package?: nome, reason: texto, reviewBy: AAAA-MM-DD, owner: quem }
  # Sem `package`, a exceção cobre todos os pacotes binários com esse id (util-linux e ncurses se
  # dividem em vários). Se sair correção, o gate volta a bloquear mesmo com a exceção registrada.
  #
  # Lote de 2026-11-07 (spec-578): Trivy 0.75.0 nas imagens api, web e worker. As 11 vêm da base
  # Debian 12 (node:24-bookworm-slim) e aparecem nas três imagens. Nenhuma tem correção no bookworm
  # (status affected, fix_deferred ou will_not_fix). O runtime roda como `node`, sem
  # privilégio, sem montar volumes e sem descompactar arquivo enviado com essas ferramentas.
  exceptions:
    - id: CVE-2023-45853
      package: zlib1g
      reason: >-
        Overflow no zipOpenNewFileInZip4_6 do minizip (contrib do zlib). O Debian marcou
        will_not_fix porque a biblioteca libz não inclui essa função, então nada do runtime a chama.
      reviewBy: '2027-02-05'
      owner: Mantenedor
    - id: CVE-2026-85091
      package: zlib1g
      reason: >-
        Heap overflow no gz_vacate (API gzFile do zlib), sem correção no bookworm. O Node usa o
        próprio zlib embutido no binário, não a libz do sistema.
      reviewBy: '2027-02-05'
      owner: Mantenedor
    - id: CVE-2026-76844
      package: zlib1g
      reason: >-
        O registro do Trivy fala de webpack-dev-middleware, ferramenta de desenvolvimento que não
        entra na imagem de produção, mas o pacote associado é o zlib1g. Sem correção no
        bookworm. Na revisão, confira se o mapeamento do Trivy foi corrigido.
      reviewBy: '2027-02-05'
      owner: Mantenedor
    - id: CVE-2025-69720
      reason: >-
        Buffer overflow no ncurses (libtinfo6, ncurses-base, ncurses-bin), sem correção no bookworm.
        Só é explorável por terminal interativo, que os containers de produção não abrem.
      reviewBy: '2027-02-05'
      owner: Mantenedor
    - id: CVE-2026-16742
      reason: >-
        Escalada local pelo systemd-homed (libsystemd0, libudev1 vêm só como bibliotecas). O
        systemd não roda no container e o homed não está instalado. Correção adiada pelo Debian.
      reviewBy: '2027-02-05'
      owner: Mantenedor
    - id: CVE-2026-41992
      package: gzip
      reason: >-
        Vazamento de memória ao descompactar LZH com o gzip, correção adiada pelo Debian. Nenhum
        processo do runtime invoca o binário gzip.
      reviewBy: '2027-02-05'
      owner: Mantenedor
    - id: CVE-2026-53613
      reason: >-
        TOCTOU no `mount` do util-linux (e bibliotecas irmãs), sem correção no bookworm. O
        usuário `node` não tem privilégio para montar e o runtime não chama `mount`.
      reviewBy: '2027-02-05'
      owner: Mantenedor
    - id: CVE-2026-53615
      reason: >-
        Overflow no parser de partição DOS do libblkid (util-linux), sem correção no bookworm.
        O runtime não lê tabelas de partição nem dispositivos de bloco.
      reviewBy: '2027-02-05'
      owner: Mantenedor
    - id: CVE-2026-78410
      reason: >-
        Bind mount restrito do util-linux sem fixar a origem, sem correção no bookworm. O runtime
        não monta nada e roda sem CAP_SYS_ADMIN.
      reviewBy: '2027-02-05'
      owner: Mantenedor
    - id: CVE-2026-54369
      package: libacl1
      reason: >-
        Symlink traversal nas funções do libacl, correção adiada pelo Debian. O runtime não
        manipula ACL e o sistema de arquivos da aplicação é somente leitura para o `node`.
      reviewBy: '2027-02-05'
      owner: Mantenedor
    - id: CVE-2026-9538
      package: perl-base
      reason: >-
        DoS no Archive::Tar do Perl, correção adiada pelo Debian. Nenhum processo do runtime
        executa Perl nem abre tar com ele (o perl-base está lá só porque o dpkg depende dele).
      reviewBy: '2027-02-05'
      owner: Mantenedor
