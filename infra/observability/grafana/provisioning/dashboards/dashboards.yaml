# Dashboards como código: os JSON de infra/observability/grafana/dashboards/ (os mesmos de
# produção) são carregados na subida: D1–D3 desde a US-085; D4–D7 com os respectivos domínios.
apiVersion: 1

providers:
  - name: contrataflow
    folder: ContrataFlow
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
