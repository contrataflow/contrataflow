# Fluxo de autenticação do ContrataFlow no Authentik (US-087 · US-090 · DEC-130 · DEC-187).
# Desde o login nativo (DEC-187) o formulário é o `/entrar` do app: o BFF conduz este *flow* pela
# API do executor (`/api/v3/flows/executor/contrataflow-authentication/`), sem o navegador ver o
# IdP. As telas do Authentik só aparecem no *step-up* e na recuperação de senha, com o tema claro
# (fundo limpo `/auth-theme/login-background.svg`, sem texto). Etapas: e-mail ou usuário e senha
# na mesma etapa, negação por reputação (5 senhas erradas → bloqueio temporário), o segundo fator
# padrão quando o usuário tem dispositivo (política da US-090) e o login (12 h no máximo; o BFF
# encerra a sessão do IdP logo depois de trocar o código). "Esqueci minha senha" leva ao fluxo de
# recuperação do blueprint 12 (US-089). Idempotente por `identifiers`; nenhum segredo aqui.
version: 1
metadata:
  name: 'ContrataFlow — tela de login'
  labels:
    blueprints.goauthentik.io/description: 'Fluxo de autenticação e tema da marca do ContrataFlow (SCR-001). Somente ambiente local/CI; em produção o mesmo conteúdo é aplicado pela infraestrutura.'
entries:
  # A etapa de MFA vem do fluxo padrão (precisa existir antes da ligação).
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: 'Default - Authentication flow'
      required: true
  # O fluxo de recuperação (link do formulário e da marca) precisa existir antes (US-089).
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: 'ContrataFlow — recuperação de senha'
      required: true

  - model: authentik_stages_password.passwordstage
    id: password
    identifiers:
      name: contrataflow-login-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
      failed_attempts_before_cancel: 5
      # Botão mostrar/ocultar senha (SCR-001).
      allow_show_password: true

  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers:
      name: contrataflow-login-identification
    attrs:
      # E-mail institucional; o nome de usuário segue aceito para os usuários semeados (US-078).
      user_fields:
        - email
        - username
      # Senha na mesma etapa (2 interações: informar e-mail e senha, confirmar).
      password_stage: !KeyOf password
      case_insensitive_matching: true
      # Mensagem genérica: não revela se a conta existe (RN-IAM-18).
      pretend_user_exists: true
      show_matched_user: false
      # "Lembrar de mim": guarda só o e-mail neste navegador (Lacuna 7).
      enable_remember_me: true
      # "Esqueci minha senha" no formulário (SCR-001 → SCR-002 · US-089).
      recovery_flow: !Find [authentik_flows.flow, [slug, contrataflow-recovery]]

  # Bloqueio por tentativas (DEC-187 · login nativo): cada senha errada baixa em 1 a reputação do
  # usuário; com 5 erros (-5) o *flow* passa a negar o acesso — mesmo com a senha certa — até a
  # reputação expirar (`AUTHENTIK_REPUTATION__EXPIRY`, 24 h por padrão) ou um administrador
  # limpá-la (Admin → Reputation scores). Só por usuário: no login nativo todas as tentativas
  # chegam do IP do BFF. O BFF mostra "acesso bloqueado temporariamente" (`LOCKED`).
  - model: authentik_policies_reputation.reputationpolicy
    id: lockout-policy
    identifiers:
      name: contrataflow-login-lockout
    attrs:
      check_ip: false
      check_username: true
      threshold: -5

  - model: authentik_stages_deny.denystage
    id: locked
    identifiers:
      name: contrataflow-login-locked
    attrs:
      deny_message: 'Acesso bloqueado temporariamente após tentativas inválidas.'

  - model: authentik_stages_user_login.userloginstage
    id: login
    identifiers:
      name: contrataflow-login-session
    attrs:
      session_duration: hours=12
      remember_me_offset: seconds=0

  - model: authentik_flows.flow
    id: flow
    identifiers:
      slug: contrataflow-authentication
    attrs:
      name: 'ContrataFlow — entrar'
      title: 'Acesse sua conta'
      designation: authentication
      authentication: none
      layout: sidebar_right

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf identification
      order: 10
  # Negação por reputação: avaliada depois da identificação, com o usuário já conhecido.
  - model: authentik_flows.flowstagebinding
    id: locked-binding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf locked
      order: 20
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf lockout-policy
      target: !KeyOf locked-binding
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage:
        !Find [
          authentik_stages_authenticator_validate.authenticatorvalidatestage,
          [name, default-authentication-mfa-validation],
        ]
      order: 30
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf login
      order: 100

  # Marca padrão: título, logo, fundo, CSS e o fluxo de autenticação acima.
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      branding_title: ContrataFlow
      branding_logo: !Format ['%s/auth-theme/contrataflow-logo.svg', !Env CF_APP_BASE_URL]
      branding_default_flow_background:
        !Format ['%s/auth-theme/login-background.svg', !Env CF_APP_BASE_URL]
      flow_authentication: !KeyOf flow
      # Recuperação da marca: também é o fluxo dos links de recuperação gerados pela API do IdP.
      flow_recovery: !Find [authentik_flows.flow, [slug, contrataflow-recovery]]
      # Tema claro do sistema de design v2 (DEC-186). Desde o login nativo (DEC-187) o IdP só
      # aparece na recuperação de senha e no *step-up*: fundo limpo, sem texto, e sem o rodapé
      # "Powered by authentik".
      branding_custom_css: |
        /* Tema do ContrataFlow (SCR-002 · sistema de design v2 — DEC-185/DEC-186). */
        :root {
          --pf-global--FontFamily--sans-serif: Inter, 'Segoe UI', Roboto, Arial, sans-serif;
          --pf-global--primary-color--100: #005BF9;
          --pf-global--primary-color--200: #004BE3;
          --pf-global--link--Color: #004BE3;
          --pf-global--link--Color--hover: #141E2B;
          --pf-global--BackgroundColor--100: #FFFFFF;
          --ak-accent: #005BF9;
        }
        .pf-c-login__main {
          background-color: #FFFFFF;
          border: 1px solid #E2E8F0;
          border-radius: 0.875rem;
          box-shadow: 0 1px 2px 0 rgb(15 23 42 / 0.04);
        }
        .pf-c-title {
          color: #141E2B;
          font-weight: 800;
        }
        .pf-c-button.pf-m-primary {
          background-color: #005BF9;
          border-radius: 0.625rem;
          font-weight: 600;
          min-height: 3rem;
        }
        .pf-c-button.pf-m-primary:hover {
          background-color: #004BE3;
        }
        .pf-c-form-control {
          border-radius: 0.625rem;
          min-height: 3rem;
        }
        /* Sem o combinador de filho: o Authentik escapa o caractere ao embutir o CSS e a regra cai. */
        ak-brand-links .pf-c-list li:last-child {
          display: none;
        }
