# clamd do ambiente local (US-078 · DEC-136). Padrões da imagem clamav/clamav + limites de
# tamanho acima do teto de upload da plataforma (UPLOADS_MAX_FILE_SIZE_MB_CEILING = 100 MB).
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# INSTREAM (usado pelo job file-scan) recusa streams maiores que este limite.
StreamMaxLength 110M
MaxFileSize 110M
MaxScanSize 400M
