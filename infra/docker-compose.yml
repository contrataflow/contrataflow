# Ambiente local do ContrataFlow (US-078 · RN-FND-13..19 · DEC-065).
#
# Use pelos scripts da raiz: `pnpm env:up`, `pnpm env:seed`, `pnpm env:reset`, `pnpm env:smoke`.
# Com o `.env` da raiz (COMPOSE_FILE), `docker compose stop|logs|ps` também funcionam na raiz.
#
# - Imagens fixadas por tag exata + digest (Renovate `docker:pinDigests`); linhas e motivos em
#   docs/engineering/versions.md §8.
# - Portas publicadas só em 127.0.0.1; ajuste a porta publicada pelo `.env` (`*_PORT`), nunca a
#   interna (FA-03).
# - Caminhos relativos partem desta pasta (infra/).
# - Perfis opcionais: `observability` (compose/observability.yml) e `full` (compose/full.yml).

name: contrataflow

x-authentik-env: &authentik-env
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Defina AUTHENTIK_SECRET_KEY no .env.}
  AUTHENTIK_POSTGRESQL__HOST: postgres
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.}
  # Administrador de bootstrap (akadmin) e token de API: só ambiente local/CI; a aplicação
  # nunca os usa em runtime (RN-FND-19). O token é usado por `pnpm env:seed` e `pnpm env:smoke`.
  AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-akadmin@contrataflow.test}
  AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?Defina AUTHENTIK_BOOTSTRAP_PASSWORD no .env.}
  AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:?Defina AUTHENTIK_BOOTSTRAP_TOKEN no .env.}
  # Sem chamadas externas do IdP local.
  AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
  AUTHENTIK_DISABLE_UPDATE_CHECK: 'true'
  AUTHENTIK_DISABLE_STARTUP_ANALYTICS: 'true'
  AUTHENTIK_AVATARS: initials
  # E-mails do Authentik (recuperação de senha) caem no Mailpit.
  AUTHENTIK_EMAIL__HOST: mailpit
  AUTHENTIK_EMAIL__PORT: '1025'
  AUTHENTIK_EMAIL__FROM: 'ContrataFlow (dev) <nao-responda@contrataflow.test>'
  # Lidos pelos blueprints em authentik/blueprints (!Env) — nenhum segredo nos arquivos.
  CF_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Defina OIDC_CLIENT_ID no .env.}
  CF_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Defina OIDC_CLIENT_SECRET no .env.}
  CF_APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  CF_DEV_USER_PASSWORD: ${CF_DEV_USER_PASSWORD:?Defina CF_DEV_USER_PASSWORD no .env.}

x-authentik: &authentik
  image: ghcr.io/goauthentik/server:2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
  restart: unless-stopped
  environment: *authentik-env
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - authentik-data:/data
    # Blueprints declarativos (RN-FND-17): reaplicados a cada start e a cada mudança (FA-04).
    - ./authentik/blueprints:/blueprints/contrataflow:ro

services:
  postgres:
    # PostgreSQL 17 + pgvector (DEC-050); bancos `contrataflow` e `authentik` (RN-FND-14).
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.}
      POSTGRES_DB: contrataflow
      PGPASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Via TCP: o servidor temporário da inicialização só escuta no socket local, então o
      # serviço só fica healthy depois dos scripts de init (bancos e extensões prontos).
      test:
        - CMD-SHELL
        - >-
          psql -h 127.0.0.1 -U postgres -d authentik -tAc 'select 1' >/dev/null &&
          psql -h 127.0.0.1 -U postgres -d contrataflow -tAc "select count(*) from pg_extension
          where extname in ('vector', 'pg_trgm', 'unaccent', 'citext')" | grep -qx 4
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis-session:
    # Sessões do BFF (crítico — DEC-131): instância própria, nunca índice de outro Redis (RN-FND-15).
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - 127.0.0.1:${REDIS_SESSION_PORT:-6379}:6379
    volumes:
      - redis-session-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cache:
    # Cache, idempotência, rate limit e filas BullMQ (exige maxmemory-policy noeviction).
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ['redis-server', '--maxmemory', '512mb', '--maxmemory-policy', 'noeviction']
    ports:
      - 127.0.0.1:${REDIS_CACHE_PORT:-6380}:6379
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # API S3 em dev (storage.md §11). Build comunitário do MinIO (DEC-065).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER no .env.}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env.}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_BASE_URL:-http://localhost:3000}
      MINIO_BROWSER_REDIRECT: 'false'
    ports:
      - 127.0.0.1:${MINIO_PORT:-9000}:9000
      - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 30

  minio-bootstrap:
    # Job idempotente: buckets, versionamento, lifecycle e usuário da aplicação; termina com
    # exit 0 (RN-FND-16). api/worker do perfil `full` dependem dele.
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Defina S3_ACCESS_KEY_ID no .env.}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Defina S3_SECRET_ACCESS_KEY no .env.}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-contrataflow-dev-quarantine}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-contrataflow-dev-documents}
      S3_BUCKET_RENDITIONS: ${S3_BUCKET_RENDITIONS:-contrataflow-dev-renditions}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    entrypoint: ['/bin/sh', '/bootstrap/minio-bootstrap.sh']
    volumes:
      - ./minio:/bootstrap:ro

  authentik-server:
    # IdP OIDC (DEC-130), mesma tag do worker; provisionado por blueprint (RN-FND-17).
    <<: *authentik
    command: server
    ports:
      - 127.0.0.1:${AUTHENTIK_PORT:-9080}:9000
      - 127.0.0.1:${AUTHENTIK_HTTPS_PORT:-9443}:9443
    healthcheck:
      test: ['CMD', 'ak', 'healthcheck']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  authentik-worker:
    <<: *authentik
    command: worker
    healthcheck:
      test: ['CMD', 'ak', 'healthcheck']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  mailpit:
    # Captura todo e-mail enviado em dev (SMTP 1025, UI/API 8025).
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_MAX_MESSAGES: '2000'
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  gotenberg:
    # HTML → PDF (DEC-060 · ADR-007). Sem credenciais de storage (storage.md §10).
    image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    restart: unless-stopped
    command: ['gotenberg', '--api-timeout=60s', '--log-level=warn']
    ports:
      - 127.0.0.1:${GOTENBERG_PORT:-3030}:3000
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/health']
      interval: 5s
      timeout: 5s
      retries: 30

  clamav:
    # clamd + freshclam (DEC-136). O 1º start baixa a base de assinaturas (~1–3 min); a base
    # fica no volume clamav-db. Obrigatório em dev (storage.md §11).
    image: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    restart: unless-stopped
    ports:
      - 127.0.0.1:${CLAMAV_PORT:-3310}:3310
    volumes:
      - clamav-db:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

volumes:
  pg-data:
  redis-session-data:
  minio-data:
  authentik-data:
  clamav-db:
