# Perfil `full` (US-078 FA-01): api, web e worker como contêineres, para quem quer tudo no
# Compose. O uso padrão é `pnpm dev` no host (hot-reload) — não rode os dois ao mesmo tempo.
#   pnpm env:up:full        (equivale a: pnpm env:up --profile full)
# Caminhos relativos partem de infra/. As variáveis apontam para os serviços pela rede do Compose.
# Login OIDC por este perfil: o issuer precisa ser o mesmo para o navegador e para o contêiner —
# tratado com o BFF na US-087.

x-app-env: &app-env
  APP_ENV: local
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  # Papéis sem BYPASSRLS criados pela migração (US-081); senha local definida por `pnpm db:migrate`.
  DATABASE_URL: postgresql://cf_app:${POSTGRES_PASSWORD}@postgres:5432/contrataflow
  REDIS_SESSION_URL: redis://redis-session:6379
  REDIS_URL: redis://redis-cache:6379
  REDIS_CACHE_URL: redis://redis-cache:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: 'true'
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-contrataflow-dev-quarantine}
  S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-contrataflow-dev-documents}
  S3_BUCKET_RENDITIONS: ${S3_BUCKET_RENDITIONS:-contrataflow-dev-renditions}
  OIDC_ISSUER_URL: http://localhost:${AUTHENTIK_PORT:-9080}/application/o/contrataflow/
  GOTENBERG_URL: http://gotenberg:3000
  CLAMAV_HOST: clamav
  CLAMAV_PORT: '3310'
  EMAIL_TRANSPORT: smtp
  SMTP_URL: smtp://mailpit:1025

x-app: &app
  build:
    context: ..
    dockerfile: infra/docker/app.Dockerfile
  image: contrataflow-app:dev
  profiles: [full]
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis-session:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
    # Buckets e política prontos antes de a aplicação receber tráfego (RN-FND-16).
    minio-bootstrap:
      condition: service_completed_successfully
    authentik-server:
      condition: service_healthy

services:
  api:
    <<: *app
    working_dir: /repo/apps/api
    command: ['node', '--enable-source-maps', 'dist/main.js']
    environment:
      <<: *app-env
      PORT: '4000'
    ports:
      - 127.0.0.1:${API_PORT:-4000}:4000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:net').connect(4000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *app
    working_dir: /repo/apps/worker
    command: ['node', '--enable-source-maps', 'dist/main.js']
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://cf_worker:${POSTGRES_PASSWORD}@postgres:5432/contrataflow

  web:
    <<: *app
    working_dir: /repo/apps/web
    command: ['node', 'node_modules/next/dist/bin/next', 'start', '--port', '3000']
    environment:
      <<: *app-env
      API_INTERNAL_URL: http://api:4000
    ports:
      - 127.0.0.1:${WEB_PORT:-3000}:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
