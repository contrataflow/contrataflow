<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Fundo das telas do Authentik (recuperação de senha e step-up — DEC-187): tema claro do
       sistema de design v2 (DEC-186), só formas decorativas e nenhum texto — o formulário do IdP
       pode cobrir qualquer parte sem cortar conteúdo. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F6FA"/>
      <stop offset="1" stop-color="#E8F0FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#005BF9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#005BF9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#ground)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g fill="none" stroke="#005BF9" stroke-opacity="0.08" stroke-width="2">
    <circle cx="1380" cy="140" r="220"/>
    <circle cx="1380" cy="140" r="320"/>
    <circle cx="160" cy="900" r="180"/>
  </g>
  <g transform="translate(110 110)" opacity="0.18">
    <path d="M0 30 L42 12 L72 30 L30 48 Z" fill="#6B9EFF"/>
    <path d="M0 30 L30 48 L30 102 L0 84 Z" fill="#005BF9"/>
    <path d="M30 48 L72 30 L72 84 L30 102 Z" fill="#2563EB"/>
  </g>
</svg>
